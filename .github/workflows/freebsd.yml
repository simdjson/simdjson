name: FreeBSD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A new push to a pull request cancels its previous run. Other runs (pushes to
# master, schedules) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.3', '15.1']
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        name: Test
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: false
          cache-after-prepare: true
          prepare: |
            pkg install -y cmake git bash
          run: |
            cmake -DCMAKE_BUILD_TYPE=Release -DSIMDJSON_DEVELOPER_MODE=ON -DSIMDJSON_COMPETITION=OFF -B build
            cmake --build build -j=$(sysctl -n hw.ncpu)
            ctest --output-on-failure --test-dir build
