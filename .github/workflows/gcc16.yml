name: gcc 16

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: 'gcc:16'
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt -y update
          apt -y --no-install-recommends install cmake ninja-build
      # Static reflection support and its autodetection test live on master
      # only, so the 4.6.x branch just checks that gcc 16 builds and passes
      # the test suite.
      - name: Build and test
        run: |
          cmake -B build -DSIMDJSON_DEVELOPER_MODE=ON -GNinja
          cmake --build build
          ctest --test-dir build --parallel $(nproc)
