name: VS18-ARM-CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run. Other runs (pushes to
# master, schedules) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
   ci:
     name: windows-vs18
     runs-on: windows-2025-vs2026
     strategy:
       fail-fast: false
       matrix:
         include:
           - {arch: ARM64}
           - {arch: ARM64EC}
     steps:
       - name: checkout
         uses: actions/checkout@v6
       - name: Use cmake
         run: |
           cmake -G "Visual Studio 18 2026" -A ${{ matrix.arch }} -DCMAKE_SYSTEM_VERSION="10.0.22621.0" -DCMAKE_CROSSCOMPILING=1 -DSIMDJSON_DEVELOPER_MODE=ON -D SIMDJSON_GOOGLE_BENCHMARKS=OFF -DSIMDJSON_EXCEPTIONS=OFF -B build  &&
           cmake --build build --verbose
