name: VS18-NoExcept-CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run. Other runs (pushes to
# master, schedules) get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: windows-vs18
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: dependencies/.cache
        key: ${{ hashFiles('dependencies/CMakeLists.txt') }}
    - name: 'Run CMake with VS18'
      uses: lukka/run-cmake@v3
      with:
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
        buildDirectory: "${{ github.workspace }}/../../_temp/windows"
        cmakeBuildType: Release
        buildWithCMake: true
        cmakeGenerator: VS18Win64
        cmakeAppendedArgs: -DSIMDJSON_COMPETITION=OFF -DSIMDJSON_DEVELOPER_MODE=ON  -DSIMDJSON_EXCEPTIONS=OFF
        buildWithCMakeArgs: --config Release

    - name: 'Run CTest'
      run: ctest -C Release  -LE explicitonly  --output-on-failure
      working-directory: "${{ github.workspace }}/../../_temp/windows"

